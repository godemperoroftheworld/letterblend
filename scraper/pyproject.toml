[tool.poetry]
name = "lblend-scraper"
version = "0.1.0"
description = "Letterboxd Scraper API"
authors = ["Tenzin Pelletier <pelletier@tenzin.live>"]

[tool.poetry.dependencies]
python = "3.12.10"
flask = { version = "^3.1.0", extras = ["async"] }
flask-cors = "^5.0.0"
hypercorn = "^0.17.3"
lxml = "^5.1.0"
letterboxdpy = "^6.5.7"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
